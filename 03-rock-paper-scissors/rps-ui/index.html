<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Rock Paper Scissors UI Version</title>
  </head>

  <body>
    <a href="../../index.html">Back to Home</a>

    <h1>Rock Paper Scissors UI Version</h1>
    <p>First to 5 wins!</p>

    <div>
      <button id="rock">Rock</button>
      <button id="paper">Paper</button>
      <button id="scissors">Scissors</button>
    </div>

    <div>
      <div style="display: flex; flex-direction: row; gap: 1rem">
        <p>You: <strong id="humanChoice"></strong></p>
        <p>Bot: <strong id="computerChoice"></strong></p>
      </div>
      <p><strong id="result"></strong></p>
    </div>

    <h2>Game Score</h2>
    <div style="display: flex; flex-direction: row; gap: 1rem">
      <p>Your Score: <strong id="userScore">0</strong></p>
      <p>Computer Score: <strong id="computerScore">0</strong></p>
    </div>

    <dialog>
			<h1 id="winner"></h1>
			<button id="playAgain">Play Again?</button>
		</dialog>

    <script src="script.js"></script>
  </body>
</html>
